name: Hallway CI

on:
  pull_request:
  push:
    branches: [main, feat/hallway-auto-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s scripts/hallway -p 'test_*.py' -v
      - name: Check systemd unit syntax
        run: |
          sudo install -d /opt/andsoul-updater
          sudo install -m 644 scripts/hallway/updater.py /opt/andsoul-updater/updater.py
          systemd-analyze verify scripts/hallway/andsoul-update.service scripts/hallway/andsoul-update.timer
      - name: Build and verify real Docker deployments and rollback
        run: python3 scripts/hallway/integration.py
